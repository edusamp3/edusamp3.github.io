<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Academic events and simulations by Eduardo Sampaio Pimenta." />
    <meta name="author" content="Eduardo Sampaio Pimenta" />
    <meta name="theme-color" content="#ffffff" />
    <title>Events and Simulations — Eduardo Sampaio Pimenta</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="theme.css" />
    <script>
      window.siteMedia = (() => {
        const renderedManifest = String.raw`{
          "photos": [],
          "videos": [
            {% assign media_files = site.static_files | sort: "path" %}
            {% for media_file in media_files %}
              {% if media_file.path contains '/assets/simulacoes/' %}
                {% if media_file.extname == '.mp4' or media_file.extname == '.webm' or media_file.extname == '.MP4' or media_file.extname == '.WEBM' %}
                  "{{ media_file.path | relative_url }}",
                {% endif %}
              {% endif %}
            {% endfor %}
            ""
          ]
        }`;
        try {
          const manifest = JSON.parse(renderedManifest);
          return { photos: [], videos: manifest.videos.filter(Boolean) };
        } catch (error) {
          return { photos: [], videos: [] };
        }
      })();
    </script>
    <script src="theme.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-en="Skip to content" data-pt="Ir para o conteúdo">Skip to content</a>
    <header class="site-header">
      <div class="page-width header-inner">
        <a class="site-name" href="index.html">Eduardo Sampaio Pimenta</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="index.html" data-en="Home" data-pt="Início">Home</a>
          <a href="index.html#research" data-en="Research" data-pt="Pesquisa">Research</a>
          <a href="index.html#publications" data-en="Publications" data-pt="Publicações">Publications</a>
          <a href="events.html#events" data-en="Events" data-pt="Eventos">Events</a>
          <a href="events.html#simulations" data-en="Simulations" data-pt="Simulações">Simulations</a>
        </nav>
        <div class="language-switch" aria-label="Language">
          <button type="button" data-language="en" aria-pressed="true">EN</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-language="pt" aria-pressed="false">PT</button>
        </div>
      </div>
    </header>
    <main id="main-content" class="page-width subpage-main">
      {% include events.html %}

      {% include simulations.html %}
    </main>
    <footer class="site-footer">
      <div class="page-width"><p>© <span id="current-year"></span> Eduardo Sampaio Pimenta</p></div>
    </footer>
  </body>
</html>
