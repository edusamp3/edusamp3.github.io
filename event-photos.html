<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Photos from academic events attended by Eduardo Sampaio Pimenta." />
    <meta name="author" content="Eduardo Sampaio Pimenta" />
    <meta name="theme-color" content="#ffffff" />
    <title>Event Photos — Eduardo Sampaio Pimenta</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="theme.css" />
    <script>window.siteMedia = { photos: [], videos: [] };</script>
    <script src="theme.js"></script>
    <script>window.siteLanguages = {{ site.data.languages | jsonify }}; window.siteUI = {{ site.data.ui | jsonify }};</script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n data-en="Skip to content" data-pt="Ir para o conteúdo" data-es="Ir al contenido">Skip to content</a>
    <header class="site-header">
      <div class="page-width header-inner">
        <a class="site-name" href="index.html">Eduardo Sampaio Pimenta</a>
        {% include navigation.html %}
        {% include language-switch.html %}
      </div>
    </header>

    <main id="main-content" class="page-width subpage-main">
      <section class="event-gallery-page" aria-labelledby="event-photo-title">
        <p class="gallery-back-link">
          <a href="events.html#events" data-i18n data-en="← Back to events" data-pt="← Voltar aos eventos" data-es="← Volver a los eventos">← Back to events</a>
        </p>
        <h1 id="event-photo-title" data-i18n data-en="Event photos" data-pt="Fotos do evento" data-es="Fotos del evento">Event photos</h1>
        <p id="event-photo-status" class="event-photo-status" data-i18n data-en="Loading photos…" data-pt="Carregando fotos…" data-es="Cargando fotos…">Loading photos…</p>
        <div id="event-photo-gallery" class="event-photo-gallery" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="page-width"><p>© <span id="current-year"></span> Eduardo Sampaio Pimenta</p></div>
    </footer>
  </body>
</html>
